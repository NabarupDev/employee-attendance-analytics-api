[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "employee-attendance-analytics-api"
version = "0.1.0"
description = "Employee Attendance & Analytics API built with FastAPI and MongoDB"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Nabarup Roy" }
]
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.28.0,<1.0.0",
    "motor>=3.3.0,<4.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-asyncio>=0.23.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers -m 'not integration'"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: Tests requiring external live database connection (skipped by default for offline hermetic execution)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
